name: Go CI

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tidy:
    name: Go module tidy check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' locally and commit the result."
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

  build:
    name: Build all Go packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  nflow-self-test:
    name: NFlow extension conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run self-test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/nflow self test

  nflow-specs:
    name: Integrated NFlow specifications
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integrated specifications
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/nflow test ./spec

  nflow-spec-lint:
    name: NFlow specification lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint NFlow specifications
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/nflow lint ./spec

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          verify: false
          args: ./...

  race-core:
    name: Go race tests · core packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race-enabled core tests
        run: go test -race -short -count=1 ./builder ./cli/... ./internal/... ./runner

  race-runtime:
    name: Go race tests · runtime packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race-enabled runtime tests
        run: go test -race -short -count=1 ./cmd/... ./compiler ./extensions/... ./formatter ./native

  harness-builder:
    name: Builder harness integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run builder harness tests
        shell: bash
        run: go run ./cmd/ci-test-summary builder

      - name: Upload builder harness test event log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-builder-test-event-log
          path: ${{ runner.temp }}/flow-test-harness.jsonl
          if-no-files-found: ignore
          retention-days: 7

  harness-cli:
    name: CLI harness integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CLI harness tests
        shell: bash
        env:
          FLOW_TEST_HARNESS_SKIP_TEST_ALL_NFLOW_CONFORMANCE: "1"
        run: go run ./cmd/ci-test-summary cli

      - name: Upload CLI harness test event log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-cli-test-event-log
          path: ${{ runner.temp }}/flow-test-harness.jsonl
          if-no-files-found: ignore
          retention-days: 7

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -show=version ./...

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmark smoke check
        run: >-
          go test -run='^$'
          -bench='^(BenchmarkResilienceWorkflow|BenchmarkExpressionValueViewTypedProjectionOutput|BenchmarkExprEvaluatorTypedProjectionOutput|BenchmarkProjectionActionInjectedRoot)$'
          -benchmem ./...

  installers:
    name: Installer validation (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test POSIX installer and release tags
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          for tag in v1.2.3 v1.2.3-rc.1+build.5; do bash validate-release-tag.sh "$tag"; done
          for tag in v1.2 v01.2.3 v1.2.3-01 v1.2.3+; do
            if bash validate-release-tag.sh "$tag" >/dev/null 2>&1; then
              echo "::error::Accepted invalid release tag: $tag"
              exit 1
            fi
          done
          mkdir "$test_dir/bin"
          calls="$test_dir/calls"
          : > "$calls"
          export NFLOW_TEST_CALLS="$calls" NFLOW_TEST_TAG=v1.2
          cat > "$test_dir/bin/curl" <<'EOF'
          #!/bin/sh
          set -eu
          url= output=
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) output=$2; shift 2 ;;
              --retry|--retry-delay) shift 2 ;;
              -*) shift ;;
              *) url=$1; shift ;;
            esac
          done
          printf '%s\n' "$url" >> "$NFLOW_TEST_CALLS"
          case "$url" in
            */releases/latest) printf '{\n  "tag_name": "%s"\n}\n' "$NFLOW_TEST_TAG" > "$output" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$test_dir/bin/curl"
          for version in garbage 1.2 01.2.3 1.2.3-01 1.2.3+; do
            before=$(wc -l < "$calls")
            if PATH="$test_dir/bin:$PATH" sh install.sh "$version" "$test_dir/invalid" >"$test_dir/out" 2>&1; then
              echo "::error::Accepted invalid installer version: $version"
              exit 1
            fi
            grep -F "invalid release version: $version" "$test_dir/out" >/dev/null
            [ "$(wc -l < "$calls")" -eq "$before" ] || { echo "::error::Downloaded assets for invalid version: $version"; exit 1; }
          done
          if PATH="$test_dir/bin:$PATH" sh install.sh latest "$test_dir/latest" >"$test_dir/out" 2>&1; then
            echo '::error::Accepted invalid latest-release tag'
            exit 1
          fi
          grep -F 'invalid release version: 1.2' "$test_dir/out" >/dev/null
          [ "$(wc -l < "$calls")" -eq 1 ] || { echo '::error::Invalid latest tag triggered asset downloads'; exit 1; }
          if PATH="$test_dir/bin:$PATH" sh install.sh '1.2.3-rc.1+build.5' "$test_dir/valid" >"$test_dir/out" 2>&1; then
            echo '::error::Expected the offline download stub to stop installation'
            exit 1
          fi
          grep -F 'could not download checksums for v1.2.3-rc.1+build.5.' "$test_dir/out" >/dev/null
          grep -F 'https://github.com/nexssp/flow/releases/download/v1.2.3-rc.1+build.5/nflow_1.2.3-rc.1+build.5_checksums.txt' "$calls" >/dev/null

      - name: Test Windows installer version validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $global:releaseLookups = 0
          $global:downloads = 0
          function Invoke-RestMethod {
            param([string]$Uri, [hashtable]$Headers, [string]$UserAgent)
            $global:releaseLookups++
            return [pscustomobject]@{ tag_name = 'v1.2' }
          }
          function Invoke-WebRequest {
            param([string]$Uri, [string]$OutFile, [hashtable]$Headers, [string]$UserAgent, [switch]$UseBasicParsing)
            $global:downloads++
            throw 'offline installer test stub'
          }
          foreach ($version in @('garbage', '1.2', '01.2.3', '1.2.3-01', '1.2.3+')) {
            try {
              & ./install.ps1 -Version $version -InstallDir "$env:RUNNER_TEMP/nflow-test" -NoPathUpdate
              throw "Accepted invalid installer version: $version"
            }
            catch {
              if ($_.Exception.Message -notlike 'Invalid release version:*') { throw }
            }
            if ($global:downloads -ne 0) { throw "Downloaded assets for invalid version: $version" }
          }
          try {
            & ./install.ps1 -Version latest -InstallDir "$env:RUNNER_TEMP/nflow-test" -NoPathUpdate
            throw 'Accepted invalid latest-release tag'
          }
          catch {
            if ($_.Exception.Message -notlike 'Invalid release version:*') { throw }
          }
          if ($global:releaseLookups -ne 1 -or $global:downloads -ne 0) { throw 'Invalid latest tag triggered asset downloads' }
          try {
            & ./install.ps1 -Version '1.2.3-rc.1+build.5' -InstallDir "$env:RUNNER_TEMP/nflow-test" -NoPathUpdate
            throw 'Expected the offline download stub to stop installation'
          }
          catch {
            if ($_.Exception.Message -notlike 'Could not download the 1.2.3-rc.1+build.5 release assets:*') { throw }
          }
          if ($global:downloads -ne 1) { throw 'Valid SemVer did not reach the asset download step' }

  # This is the stable branch-protection gate; keep its identity unchanged.
  verify:
    name: build · lint · test
    if: ${{ always() }}
    needs:
      - module-tidy
      - build
      - nflow-self-test
      - nflow-specs
      - nflow-spec-lint
      - lint
      - race-core
      - race-runtime
      - harness-builder
      - harness-cli
      - vulnerability
      - benchmark
      - installers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report every failed required check
        env:
          MODULE_TIDY_RESULT: ${{ needs.module-tidy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NFLOW_SELF_TEST_RESULT: ${{ needs.nflow-self-test.result }}
          NFLOW_SPECS_RESULT: ${{ needs.nflow-specs.result }}
          NFLOW_SPEC_LINT_RESULT: ${{ needs.nflow-spec-lint.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RACE_CORE_RESULT: ${{ needs.race-core.result }}
          RACE_RUNTIME_RESULT: ${{ needs.race-runtime.result }}
          HARNESS_BUILDER_RESULT: ${{ needs.harness-builder.result }}
          HARNESS_CLI_RESULT: ${{ needs.harness-cli.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
        run: |
          set -Eeuo pipefail
          failed=0
          check_result() {
            local check_id="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              printf '::error::Required check %s result: %s\n' "$check_id" "${result:-unknown}"
              failed=1
            fi
          }
          check_result module-tidy "$MODULE_TIDY_RESULT"
          check_result build "$BUILD_RESULT"
          check_result nflow-self-test "$NFLOW_SELF_TEST_RESULT"
          check_result nflow-specs "$NFLOW_SPECS_RESULT"
          check_result nflow-spec-lint "$NFLOW_SPEC_LINT_RESULT"
          check_result lint "$LINT_RESULT"
          check_result race-core "$RACE_CORE_RESULT"
          check_result race-runtime "$RACE_RUNTIME_RESULT"
          check_result harness-builder "$HARNESS_BUILDER_RESULT"
          check_result harness-cli "$HARNESS_CLI_RESULT"
          check_result vulnerability "$VULNERABILITY_RESULT"
          check_result benchmark "$BENCHMARK_RESULT"
          check_result installers "$INSTALLERS_RESULT"
          exit "$failed"
