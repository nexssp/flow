name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Compile all Go packages
        run: go build ./...

      - name: Run Go tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install nflow CLI
        run: go install ./cmd/nflow

      - name: Lint all user-facing Flow examples
        run: nflow lint ./examples/...

      - name: Run user-facing Flow examples
        run: task examples
