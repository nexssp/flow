name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-integration:
    name: harness integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full harness integration suite (without race instrumentation)
        run: task test:harness

      - name: Upload full harness test event log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-event-log
          path: ${{ runner.temp }}/flow-test-harness.jsonl
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: build · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fast binary install (~2s), isolates linter dependencies from go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          task tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'task tidy' locally and commit the result."
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Tools
        run: task tools

      - name: Build
        run: task build

      - name: Run core CI gate (harness integration runs in parallel)
        run: task ci:fast

      - name: Fast benchmark smoke check (exclude cold harness builds)
        run: task bench
