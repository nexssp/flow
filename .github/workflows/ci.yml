name: Go CI

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-builder:
    name: harness builder tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run builder harness tests
        shell: bash
        run: go run ./cmd/ci-test-summary builder

      - name: Upload builder harness test event log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-builder-test-event-log
          path: ${{ runner.temp }}/flow-test-harness.jsonl
          if-no-files-found: ignore
          retention-days: 7

  harness-cli:
    name: harness CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CLI harness tests
        shell: bash
        env:
          FLOW_TEST_HARNESS_SKIP_TEST_ALL_NFLOW_CONFORMANCE: "1"
        run: go run ./cmd/ci-test-summary cli

      - name: Upload CLI harness test event log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-cli-test-event-log
          path: ${{ runner.temp }}/flow-test-harness.jsonl
          if-no-files-found: ignore
          retention-days: 7

  module-tidy:
    name: module tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' locally and commit the result."
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Run self-test
        run: go run ./cmd/nflow self test

      - name: Run integrated specifications
        run: go run ./cmd/nflow test ./spec

      - name: Lint NFlow specifications
        run: go run ./cmd/nflow lint ./spec

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          verify: false
          args: ./...

  race-core:
    name: race core packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race-enabled core tests
        run: go test -race -short -count=1 ./builder ./cli/... ./internal/... ./runner

  race-runtime:
    name: race runtime packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race-enabled runtime tests
        run: go test -race -short -count=1 ./cmd/... ./compiler ./extensions/... ./formatter ./native

  vulnerability:
    name: vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -show=version ./...

  benchmark:
    name: benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmark smoke check
        run: >-
          go test -run='^$'
          -bench='^(BenchmarkResilienceWorkflow|BenchmarkExpressionValueViewTypedProjectionOutput|BenchmarkExprEvaluatorTypedProjectionOutput)$'
          -benchmem ./...

  verify:
    name: build · lint · test
    if: ${{ always() }}
    needs:
      - module-tidy
      - acceptance
      - lint
      - race-core
      - race-runtime
      - vulnerability
      - benchmark
      - harness-builder
      - harness-cli
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all verification jobs to pass
        run: |
          results=(
            "${{ needs.module-tidy.result }}"
            "${{ needs.acceptance.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.race-core.result }}"
            "${{ needs.race-runtime.result }}"
            "${{ needs.vulnerability.result }}"
            "${{ needs.benchmark.result }}"
            "${{ needs.harness-builder.result }}"
            "${{ needs.harness-cli.result }}"
          )
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with result: $result"
              exit 1
            fi
          done
