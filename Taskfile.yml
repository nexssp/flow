# Install Task: go install github.com/go-task/task/v3/cmd/task@latest
version: '3'

vars:
  NFLOW: 'go run ./cmd/nflow'
  BASE:
    sh: git merge-base HEAD origin/main 2>/dev/null || echo HEAD
  CENTRAL_REF: 'main'
  PKG: '{{.CLI_ARGS | default "./..."}}'
  GOTEST: '{{.GOTEST | default "go test"}}'

tasks:
  default: { cmds: [task --list --sort none], silent: true }

  build:     { desc: "go build [./...]",                              cmds: ['go build {{.PKG}}'] }
  build:bin: { desc: "go build -trimpath -o bin/ ./cmd/...",        cmds: [go build -trimpath -o bin/ ./cmd/...] }
  tidy:      { desc: "go mod tidy",                                 cmds: [go mod tidy] }
  clean:     { desc: "rm -rf bin coverage.out",                     cmds: [rm -rf bin coverage.out] }

  test:              { desc: "{{.GOTEST}} -short [./...]",         cmds: ['{{.GOTEST}} -short {{.PKG}}'] }
  test:nocache:      { desc: "{{.GOTEST}} -count=1 [./...]",       cmds: ['{{.GOTEST}} -count=1 {{.PKG}}'] }
  test:race:         { desc: "{{.GOTEST}} -race -short [./...]",   cmds: ['{{.GOTEST}} -race -short {{.PKG}}'] }
  test:race:nocache: { desc: "{{.GOTEST}} -race -count=1 [./...]", cmds: ['{{.GOTEST}} -race -count=1 {{.PKG}}'] }
  test:cover:        { desc: "{{.GOTEST}} -coverprofile=coverage.out [./...]",  cmds: ['{{.GOTEST}} -coverprofile=coverage.out -short {{.PKG}}', go tool cover -func=coverage.out] }
  bench:             { desc: "{{.GOTEST}} -run='^$' -bench=. -benchmem [./...]",cmds: ["{{.GOTEST}} -run='^$' -bench=. -benchmem {{.PKG}}"] }

  test:smoke:        { desc: "{{.GOTEST}} ./cli/... -race -count=1 -v -run TestSmoke", cmds: ['{{.GOTEST}} ./cli/... -race -count=1 -v -run TestSmoke'] }

  self: {desc: '{{.NFLOW}} self test', cmds: ['{{.NFLOW}} self test']}

  specs:
    desc: Execute all integrated acceptance scenarios (including @assert checks)
    cmds:
      - |
        status=0
        for spec in \
          ./spec/01_order_intake/main.nflow \
          ./spec/01_order_intake/normalize.nflow \
          ./spec/02_support_triage/happy.nflow \
          ./spec/02_support_triage/fallback.nflow \
          ./spec/03_reconciliation/main.nflow
        do
          echo "=== $spec ==="
          if {{.NFLOW}} run "$spec"; then
            echo "PASS: $spec"
          else
            echo "FAIL: $spec" >&2
            status=1
          fi
        done
        exit "$status"

  catalog:
    desc: Write the compiler catalog to catalog.json
    cmds:
      - '{{.NFLOW}} catalog > catalog.json'

  lint:nflow:
    desc: Lint the in-repository spec files
    cmds:
      - '{{.NFLOW}} lint ./spec'


  fmt:       { desc: "golangci-lint fmt", cmds: [golangci-lint fmt] }
  lint:      { desc: "golangci-lint run [./...]", cmds: ['golangci-lint run {{.PKG}}'] }
  lint:new:  { desc: 'golangci-lint run --new-from-rev="BASE" [./...]', cmds: ['golangci-lint run --new-from-rev="{{.BASE}}" {{.PKG}}'] }
  lint:fix:  { desc: 'golangci-lint run --fix --new-from-rev="BASE" [./...]', cmds: ['golangci-lint run --fix --new-from-rev="{{.BASE}}" {{.PKG}}'] }
  vuln:      { desc: "govulncheck -show=version [./...]", cmds: ['govulncheck -show=version {{.PKG}}'] }

  # ── Workflows (Gates) ────────────────────────────────────────────

  pre-commit: { desc: "[self, lint, test]", deps: [self, lint, test] }
  pre-push:   { desc: "[self, lint, test:race]", deps: [self, lint, test:race] }
  ci:
    desc: "[self, specs, lint, test:race:nocache] (parallel + failfast)"
    deps: [self, specs, lint, test:race:nocache]
    output: prefixed

  tools:     { desc: "go install -> gotest.tools/gotestsum@latest golang.org/x/vuln/cmd/govulncheck@latest",  cmds: ["go install gotest.tools/gotestsum@latest", "go install golang.org/x/vuln/cmd/govulncheck@latest"] }

  setup: { desc: "[setup:files, tools]", deps: [setup:files, tools] }

  setup:files:
    desc: "Fetch missing repo templates (LICENSE, .gitignore, configs...)"
    cmds:
      - |
        for f in LICENSE NOTICE .gitattributes .gitignore .golangci.yml .pre-commit-config.yaml; do
          test -f "$f" || { echo "→ Fetching $f..."; curl -sSfL "https://raw.githubusercontent.com/nexssp/.github/{{.CENTRAL_REF}}/$f" -o "$f"; }
        done


  'ext:new':
    desc: 'Scaffold a bundle: task ext:new -- my_extension'
    vars:
      NAME: '{{.CLI_ARGS}}'
    preconditions:
      - sh: test -n "{{.NAME}}"
        msg: 'usage: task ext:new -- <go_package_name>'
      - sh: echo "{{.NAME}}" | rg -q '^[A-Za-z_][A-Za-z0-9_]*$'
        msg: 'bundle name must be a valid Go package identifier'
      - sh: test ! -e "extensions/{{.NAME}}"
        msg: 'extensions/{{.NAME}} already exists'
    cmds:
      - '{{.NFLOW}} init --bundle "extensions/{{.NAME}}"'
